version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: protocolo_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      TZ: America/Sao_Paulo
      PGTZ: GMT-3
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - protocolo_network

  web:
    image: python:3.11-slim
    container_name: protocolo_web
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "
        set -e;
        echo 'Instalando git e dependências do sistema...';
        apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*;
        echo 'Baixando código do GitHub...';
        rm -rf /tmp/sistema;
        git clone --depth 1 --branch main https://github.com/Gabriell-Bravo/Sistema_Protocolo-CGM.git /tmp/sistema;
        cp -a /tmp/sistema/. /app/;
        echo 'Instalando dependências Python...';
        pip install --no-cache-dir -r /app/requirements.txt;
        echo 'Aplicando migrações no banco...';
        python manage.py migrate --noinput;
        python manage.py createsuperuser --noinput || true;
        python manage.py collectstatic --noinput;
        echo 'Iniciando aplicação...';
        gunicorn --bind 0.0.0.0:8800 --workers 3 --timeout 120 protocolo_project.wsgi:application
      "
    ports:
      - '8800:8800'
    environment:
      DJANGO_SECRET_KEY: '${DJANGO_SECRET_KEY}'
      DJANGO_DEBUG: '${DJANGO_DEBUG:-False}'
      DJANGO_ALLOWED_HOSTS: '${DJANGO_ALLOWED_HOSTS:-controladoria.saquarema.rj.gov.br,localhost,127.0.0.1}'
      DJANGO_CSRF_TRUSTED_ORIGINS: '${DJANGO_CSRF_TRUSTED_ORIGINS:-https://controladoria.saquarema.rj.gov.br,http://localhost:8800,http://127.0.0.1:8800}'
      DJANGO_HTTPS: '${DJANGO_HTTPS:-False}'
      DJANGO_SUPERUSER_USERNAME: '${DJANGO_SUPERUSER_USERNAME}'
      DJANGO_SUPERUSER_EMAIL: '${DJANGO_SUPERUSER_EMAIL}'
      DJANGO_SUPERUSER_PASSWORD: '${DJANGO_SUPERUSER_PASSWORD}'
      TZ: America/Sao_Paulo
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_HOST: '${POSTGRES_HOST}'
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - protocolo_network

volumes:
  postgres_data:
    driver: local

networks:
  protocolo_network:
    driver: bridge
